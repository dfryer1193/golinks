name: Build and test
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install dependencies
        run: go get ./...
      - name: Build
        run: make build
      - name: Test
        run: go test -json ./... > TestResults-${{ github.run_id }}.json
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: golinks-test-results-${{ github.run_id }}.json
          path: TestResults-${{ github.run_id }}.json
